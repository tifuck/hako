[package]
name = "hakod"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "hako device daemon: owns HID, audio routing and config for gaming peripherals"

[[bin]]
name = "hakod"
path = "src/main.rs"

[dependencies]
hako-core = { workspace = true }
hako-audio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
libc = "0.2"
evdev = "0.13"
# LAN audio: Noise_XX_25519_ChaChaPoly_BLAKE2s (pure Rust).
snow = { version = "0.10", default-features = false, features = ["std", "use-curve25519", "use-chacha20poly1305", "use-blake2", "use-getrandom"] }
