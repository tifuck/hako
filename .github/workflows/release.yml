name: Release

# Push a tag vX.Y.Z (matching the workspace version) to build and publish.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    # Oldest supported runner: the binaries need its glibc (2.35) or newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Build scripts must not read the job token from .git/config.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0
      # No build cache here: a release must not restore state other runs wrote.
      - name: System deps (egui/winit, PipeWire bindings)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libpipewire-0.3-dev libspa-0.2-dev libclang-dev clang pkg-config pipewire-bin libpipewire-0.3-modules
      - name: PipeWire 1.0 headers, 0.3.48 library
        run: packaging/pipewire-headers.sh "$RUNNER_TEMP/pw" >> "$GITHUB_ENV"
      - name: Tag matches workspace version
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml v$v"; exit 1; }
      - run: scripts/check-public.sh
      - run: cargo test --workspace --locked
      - name: Audio engine against PipeWire 0.3.48
        # Release mode: pipewire-rs debug-asserts on 0.3.x sequence numbers.
        run: |
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-$RUNNER_TEMP/xdg}"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          cargo test --release --locked -p hako-audio live_engine_reconnects -- --ignored --exact engine::tests::live_engine_reconnects
      - name: ChatMix pw-loopback against PipeWire 0.3.48
        # hako's exact pw-loopback arguments must parse there (no `-n` before 0.3.52).
        run: |
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-$RUNNER_TEMP/xdg}"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          timeout 600 cargo test --release --locked -p hako-audio live_loopback_stays_up -- --ignored --exact tests::live_loopback_stays_up
      - name: Build
        # Embeds owner/repo so installed builds know where to look for updates.
        env:
          HAKO_REPO: ${{ github.repository }}
        run: cargo build --release --locked --workspace
      - name: Smoke test binaries
        run: |
          # Every PipeWire function must resolve against the runner's 0.3.48.
          LD_BIND_NOW=1 target/release/hakod --version
          target/release/hako --version
          if ldd target/release/hako target/release/hakod target/release/libhako_fx.so | grep 'not found'; then exit 1; fi
      - name: Package
        run: |
          name="hako-${GITHUB_REF_NAME#v}-x86_64-linux"
          d="dist/$name"
          mkdir -p "$d/bin" "$d/lib"
          cp target/release/hakod target/release/hako "$d/bin/"
          cp target/release/libhako_fx.so "$d/lib/"
          cp --parents scripts/install-user.sh scripts/fix-hidraw-perms.sh \
            packaging/hako.desktop packaging/systemd/hakod.service \
            udev/70-hako.rules client/assets/icon.png "$d/"
          cp README.md LICENSE NOTICE "$d/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          packaging/deb/build-deb.sh "${GITHUB_REF_NAME#v}" target/release dist
          (cd dist && sha256sum *.tar.gz *.deb > SHA256SUMS && cat SHA256SUMS)
      - name: Install test (.deb)
        run: |
          sudo apt-get install -y ./dist/hako_*.deb
          dpkg -s hako | grep -E '^(Version|Depends)'
          /usr/bin/hako --version && /usr/bin/hakod --version
          test -f /usr/lib/udev/rules.d/70-hako.rules
          test -f /usr/lib/hako/libhako_fx.so
          test -f /usr/lib/systemd/user/hakod.service
          test -L /etc/systemd/user/default.target.wants/hakod.service
          sudo apt-get remove -y hako
          test ! -e /etc/systemd/user/default.target.wants/hakod.service
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.tar.gz dist/SHA256SUMS \
            --title "hako $GITHUB_REF_NAME" --generate-notes --verify-tag
